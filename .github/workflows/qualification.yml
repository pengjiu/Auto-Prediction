name: Mainline qualification
on:
  push:
    branches: [main, codex/review-merge-publication]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
      - name: Strict temporal source checks and mutation regressions
        run: |
          pnpm exec tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --types node --skipLibCheck research/payoff-economics/s5/export.ts research/payoff-economics/s5/test-export.ts
          packages/control-plane/node_modules/.bin/tsx research/payoff-economics/s5/test-export.ts
      - name: Strict coverage source and composition regressions
        run: |
          pnpm exec tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --types node --skipLibCheck research/payoff-economics/s6/export.ts research/payoff-economics/s6/test-export.ts
          packages/control-plane/node_modules/.bin/tsx research/payoff-economics/s6/test-export.ts
      - run: node research/payoff-economics/offline/run.mjs
      - name: Recompile source through the actual semantic export CLI
        run: |
          packages/control-plane/node_modules/.bin/tsx research/payoff-economics/s3/export.ts research/payoff-economics/s3/fixtures/synthetic-source.json "$RUNNER_TEMP/semantic-export.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/semantic-export.json")), JSON.parse(fs.readFileSync("research/payoff-economics/s3/fixtures/synthetic-export.json")));'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Optional wheels for cross-runtime real-capture replay
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Recompile full real source and analyze original captured bytes
        run: python research/payoff-economics/s3/replay_real_fixture.py --output "$RUNNER_TEMP/real-family-replay.json"
      - name: Replay the pinned complete temporal capture without network
        run: python research/payoff-economics/s5/replay.py --output "$RUNNER_TEMP/temporal-replay.json"
      - name: Tests cannot rewrite tracked source or historical evidence
        run: git diff --exit-code
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned optional research dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - run: python -m unittest discover -s research/payoff-economics/s1 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/payoff-economics/s2 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/payoff-economics/s3 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/payoff-economics/s4 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/payoff-economics/s5 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/payoff-economics/s6 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/payoff-economics/tests -v
      - name: Research cannot mutate production sources or historical evidence
        run: git diff --exit-code
