name: Local source handoff
on:
  push:
    branches: [codex/mutation-real-rule-family]
    paths: [.github/workflows/local-source-handoff.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source and history without credentials
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          git bundle create "$RUNNER_TEMP/history.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: real-family-source
          retention-days: 2
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/history.bundle
            ${{ runner.temp }}/head.txt
