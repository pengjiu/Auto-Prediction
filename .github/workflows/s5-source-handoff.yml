name: S5 source handoff
on:
  push:
    branches: [codex/mutation-temporal-relations]
    paths: [.github/workflows/s5-source-handoff.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact source and history without credentials
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          git bundle create "$RUNNER_TEMP/history.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: s5-resume-source
          retention-days: 3
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/history.bundle
            ${{ runner.temp }}/head.txt
