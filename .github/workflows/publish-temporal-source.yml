name: Publish tested temporal research source
on:
  push:
    branches: [codex/mutation-temporal-relations]
    paths: [.github/workflows/publish-temporal-source.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'pengjiu/Auto-Prediction' && github.ref == 'refs/heads/codex/mutation-temporal-relations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply exact local source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          parts=[pathlib.Path('research/payoff-economics/s5-transfer-%d.b64'%i) for i in range(2)]
          changed=set(subprocess.check_output(['git','diff','--name-only','5c4772e46a47b897f5174a71b39fab37af4b0220','HEAD'],text=True).splitlines())
          assert changed == {str(p) for p in parts}|{'.github/workflows/publish-temporal-source.yml'},changed
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='337168f2d27b7631cd5ac5e4e43ae0d42b7459f60d463d807850d68172c45fc3'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'s5.patch';p.write_bytes(patch)
          subprocess.run(['git','rm','--','plans/temporal-relation-discovery.md',*[str(x) for x in parts]],check=True)
          subprocess.run(['git','apply','--index','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          expected={
          'plans/temporal-relation-discovery.md':'447746d5846351fcd475d19f6452077f7ce720e8',
          'research/payoff-economics/s5/README.md':'1449350c993eaac509be58bbdb8c19a7a58e0211',
          'research/payoff-economics/s5/campaign.py':'d9c49fe71424035f56171d662ed294d016d3e2fd',
          'research/payoff-economics/s5/export.ts':'e5b516392abd972e792752d8b5cca47025bef8d4',
          'research/payoff-economics/s5/historical-relation-audit.json':'4b634f209d456fe3076edaadfd01ea72ea65000f',
          'research/payoff-economics/s5/reviewed-scopes.json':'f460281843dad443b784bda63011e28facdda475',
          'research/payoff-economics/s5/seed-source.json':'b43ae0850f2d38cc1579d6e75b20d771cc6eadd3',
          'research/payoff-economics/s5/temporal.py':'b8f3cc3db1995193de122b2dd0ba94e5fb874533',
          'research/payoff-economics/s5/test-export.ts':'226a033be2974e5ef22a03abf29a0e6192997dd6',
          'research/payoff-economics/s5/test_campaign.py':'5cf82d2053c50ae4ff3693ccaf6ef277cff75ea2',
          'research/payoff-economics/s5/test_temporal.py':'59ff4b70738966440adf8434abb3b3fffeb6680a'}
          for path,want in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==want,path
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==set(expected)|{str(x) for x in parts},actual
          PY
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/codex/mutation-temporal-relations | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Auto Prediction research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(research): preserve temporal counterworlds and test high-order interval coverage' -m 'Source patch and all 11 blob identities match locally tested files. Conditional research only, no production authority or live effects.'
          git push origin HEAD:refs/heads/codex/mutation-temporal-relations
