name: S1 research qualification
on:
  push:
    branches:
      - codex/mutation-state-maximin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated research solver wheels
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Unit, adversarial and oracle comparisons
        run: python -m unittest discover -s research/payoff-economics/s1 -p 'test_*.py' -v
      - name: Recompute purely synthetic benchmark
        run: |
          python research/payoff-economics/s1/benchmark.py
          python - <<'PY'
          import json
          with open("research/payoff-economics/s1/synthetic-benchmark.json") as f:
              x = json.load(f)
          assert x["dataset"] == "SYNTHETIC_FINITE_PAYOFF_MODELS_ONLY"
          assert x["cases"] == 150
          assert x["milp_strictly_stronger"] + x["equal"] == 150
          assert x["real_market_pnl_claimed"] is False
          assert x["capturable_execution_estimated"] is False
          print("Research-only dataset and no-profit-claim invariant: PASS")
          PY

  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
