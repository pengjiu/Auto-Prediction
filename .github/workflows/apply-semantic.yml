name: Publish tested semantic source
on:
  push:
    branches: [codex/mutation-semantic-binding]
    paths: [.github/workflows/apply-semantic.yml]
permissions:
  contents: write
concurrency:
  group: publish-semantic-source
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pengjiu/Auto-Prediction' && github.ref == 'refs/heads/codex/mutation-semantic-binding'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify transport and apply exact source-only patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 5674ad8bd10bd28dc8bfdfa593385e7329a82d73^{tree})" = 796603e37fae986ec611fa6334087b1ae31aa859
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          root = pathlib.Path('research/payoff-economics/s3')
          parts = [root / ('transport-%d.b64' % i) for i in range(4)]
          expected = ['17968213322e270ce0ab20838c858ca6581131d4','bdaebca58adfa43ff0ffedd630d4612e47ba75c8','a443b09b73a09687d49aa2718340ca2f10e4da6c','4a42562438bbf93c64805885632b22890cdaed00']
          for p, want in zip(parts, expected):
              actual = subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if actual != want: raise SystemExit('Transport mismatch: ' + str(p))
          changed = set(subprocess.check_output(['git','diff','--name-only','5674ad8bd10bd28dc8bfdfa593385e7329a82d73','HEAD'],text=True).splitlines())
          allowed = {str(p) for p in parts} | {'.github/workflows/apply-semantic.yml'}
          if changed != allowed: raise SystemExit('Concurrent changes: ' + repr(changed ^ allowed))
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          if hashlib.sha256(patch).hexdigest() != 'df9145d4a424421a7540b0b16d1e138cd46be473bb096e2ae639a8b193297835':
              raise SystemExit('Patch checksum mismatch')
          if b'diff --git a/.github/' in patch: raise SystemExit('Source publisher cannot modify workflow files')
          pathlib.Path(os.environ['RUNNER_TEMP'],'semantic.patch').write_bytes(patch)
          PY
          git apply --index --check "$RUNNER_TEMP/semantic.patch"
          git apply --index "$RUNNER_TEMP/semantic.patch"
          git diff --cached --check
          git diff --exit-code
      - name: Compare source tree without temporary transport
        shell: bash
        run: |
          set -euo pipefail
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/clean.index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/clean.index"
          git update-index --force-remove -- .github/workflows/apply-semantic.yml research/payoff-economics/s3/transport-{0,1,2,3}.b64
          test "$(git write-tree)" = 2e0ca6a8ae7ec414c10ea8b1fcf994b20403ba96
      - name: Publish reviewed source on candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/mutation-semantic-binding | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'Auto Prediction review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind full settlement conditions and export source-recompiled research matrices' -m 'Locally checked tree excluding transport: 2e0ca6a8ae7ec414c10ea8b1fcf994b20403ba96. Six semantic false admissions and inverse shadow-leg bug repaired. Node check/build and 1113 tests pass; S1 16, S2 32, S3 6, offline 43, patch 8. Bounded controlled grammar only: historical real-description coverage remains zero. Synthetic bridge does not demonstrate profit. No credentials, orders or funds.'
          git push origin HEAD:refs/heads/codex/mutation-semantic-binding
          printf 'Published source commit: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git write-tree)" >> "$GITHUB_STEP_SUMMARY"
