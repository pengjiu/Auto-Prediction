name: S2 economic research qualification
on:
  push:
    branches: [codex/mutation-market-economics]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned optional research wheels
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Original S1 oracle regressions
        run: python -m unittest discover -s research/payoff-economics/s1 -p 'test_*.py' -v
      - name: S2 evidence, exact witness, baseline and sampled execution tests
        run: python -m unittest discover -s research/payoff-economics/s2 -p 'test_*.py' -v
      - name: No mutation of tracked production files during research tests
        run: git diff --exit-code -- packages apps pnpm-lock.yaml package.json
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
