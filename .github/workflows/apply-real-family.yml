name: Publish tested real family source
on:
  push:
    branches: [codex/mutation-real-rule-family]
    paths: [.github/workflows/apply-real-family.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tested-real-family
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pengjiu/Auto-Prediction' && github.ref == 'refs/heads/codex/mutation-real-rule-family'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate the local tested patch and bound source ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 10793e821d48863191a7eb8fc0c4a28846e4a250 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          paths = [pathlib.Path('research/payoff-economics/s3/transport-real-%d.b64' % i) for i in range(3)]
          expected = ['d401bb4d9afa79206802119d7f30d9cb2c38ebd7','05b4d6674c552df779a47c1a405449467ffa7418','fb05d81c7c791567ae1aa0d97a1856d4061a49d9']
          for path, want in zip(paths, expected):
              if subprocess.check_output(['git','hash-object',str(path)],text=True).strip() != want:
                  raise SystemExit('transport checksum mismatch')
          changed = set(subprocess.check_output(['git','diff','--name-only','10793e821d48863191a7eb8fc0c4a28846e4a250','HEAD'],text=True).splitlines())
          if changed != {str(p) for p in paths} | {'.github/workflows/apply-real-family.yml'}:
              raise SystemExit('unexpected concurrent source change')
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in paths),validate=True))
          if hashlib.sha256(patch).hexdigest() != 'b1aefd345aeed416efe153dff684a334c0f5e6ccef4d18867e9719364634a437':
              raise SystemExit('decoded patch checksum mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'],'real.patch').write_bytes(patch)
          PY
          git apply --index --check "$RUNNER_TEMP/real.patch"
          git apply --index "$RUNNER_TEMP/real.patch"
      - name: Restore exact previously captured public artifact without forwarding credentials
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          endpoint = 'https://api.github.com/repos/pengjiu/Auto-Prediction/actions/artifacts/11726789293/zip'
          request = urllib.request.Request(endpoint,headers={
              'Authorization':'Bearer '+os.environ['GH_ARTIFACT_TOKEN'],
              'Accept':'application/vnd.github+json','User-Agent':'Auto-Prediction-research-publication'})
          try:
              with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
                  payload = response.read(2_000_001)
          except urllib.error.HTTPError as redirect:
              if redirect.code not in (301,302,303,307,308):
                  raise
              location = redirect.headers['Location']; redirect.close()
              parsed = urllib.parse.urlparse(location)
              if parsed.scheme != 'https' or parsed.username or parsed.password:
                  raise SystemExit('unsafe artifact redirect')
              # New anonymous request: never forward the GitHub token to storage.
              with urllib.request.urlopen(urllib.request.Request(location),timeout=30) as response:
                  payload = response.read(2_000_001)
          if len(payload) > 2_000_000 or hashlib.sha256(payload).hexdigest() != 'fac0590be30054a37d85775764d75bfe1fe59c6cc9d6ad533d02f307536f6e7a':
              raise SystemExit('original public capture artifact checksum mismatch')
          pathlib.Path('research/payoff-economics/s3/fixtures/real-binance/capture-2026-10-12.zip').write_bytes(payload)
          PY
      - name: Verify clean final tree equals local tested bytes
        run: |
          set -euo pipefail
          git add research/payoff-economics/s3/fixtures/real-binance/capture-2026-10-12.zip
          git diff --cached --check
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/clean.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/clean.index" git update-index --force-remove -- .github/workflows/apply-real-family.yml research/payoff-economics/s3/transport-real-0.b64 research/payoff-economics/s3/transport-real-1.b64 research/payoff-economics/s3/transport-real-2.b64
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/clean.index" git write-tree)" = e5f376b1ebe2d8bf7c893f581887d0e1fbfecb87
          git diff --exit-code
      - name: Publish source to isolated review branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/mutation-real-rule-family | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Auto Prediction research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: interpret full real Binance rules for conditional source-bound economics' -m 'Locally qualified clean tree e5f376b1ebe2d8bf7c893f581887d0e1fbfecb87. Full check/build/1140 Node tests and S1 16, S2 32, S3 15 pass. Actual original capture CLI: 2 source groups, 16 admitted rounds, 16 exact gross price witnesses, zero positive or incremental gross value. No semantic certificate, LLM calls, real orders or funds. Retain original artifact and unresolved source/oracle/timing assumptions.'
          git push origin HEAD:refs/heads/codex/mutation-real-rule-family
          printf 'Published source: %s\nClean target tree: e5f376b1ebe2d8bf7c893f581887d0e1fbfecb87\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
