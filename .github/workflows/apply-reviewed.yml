name: Publish verified review tree
on:
  push:
    branches: [codex/review-merge-publication]
    paths: [.github/workflows/apply-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: publish-reviewed-tree
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pengjiu/Auto-Prediction' && github.ref == 'refs/heads/codex/review-merge-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Decode and validate exact local patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4dcef72b7969927fb2d415147666fc779a9561d8 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          root = pathlib.Path('research/payoff-economics/review')
          parts = [root / ('transport-%d.b64' % i) for i in range(4)]
          expected = ['9a33435c3f4b1550f17a2e261ceb641bc13a84a2','cfe6941575e6698d31f04f53884fed15eee726e5','aa7fefef8bf1e0f5bf9c91f68a5f8506e5a8e16b','be4a51157140ff339102c32d7da5db4bb8e6f2c5']
          for p, want in zip(parts, expected):
              actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
              if actual != want:
                  raise SystemExit('Transport blob mismatch: ' + str(p) + ' ' + actual)
          changed = set(subprocess.check_output(['git','diff','--name-only','4dcef72b7969927fb2d415147666fc779a9561d8','HEAD'], text=True).splitlines())
          allowed = {str(p) for p in parts} | {'.github/workflows/apply-reviewed.yml'}
          if changed != allowed:
              raise SystemExit('Unexpected concurrent source changes: ' + repr(changed ^ allowed))
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          if hashlib.sha256(patch).hexdigest() != 'a638d33672bd96562258ef7b122dc0b6dcbe0f39207a010b599da1fc37bff812':
              raise SystemExit('Decoded patch checksum mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'review.patch').write_bytes(patch)
          PY
      - name: Apply patch and prove repository tree equality
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/apply-reviewed.yml research/payoff-economics/review/transport-{0,1,2,3}.b64
          git apply --unidiff-zero --index --check "$RUNNER_TEMP/review.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/review.patch"
          git diff --cached --check
          test "$(git write-tree)" = 'ed1d7ad5461c7957783dce6c41117b740929a4ae'
          git diff --exit-code
      - name: Commit exact tested tree to review branch only
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/review-merge-publication | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'Auto Prediction review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close certification and research-model gaps found in all-branch review' -m 'Exact tree matches locally qualified ed1d7ad5461c7957783dce6c41117b740929a4ae. Workspace check/build/test passed (1086 tests); S1 16, S2 32, offline 43 and patch-tool 8 passed. Revalidate materialization plans and shadow observations, enforce units/minimum orders, prevent evidence mutation and fake depth replenishment. Research-only; no funds or live trading.'
          git push origin HEAD:refs/heads/codex/review-merge-publication
          printf 'Published commit: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git write-tree)" >> "$GITHUB_STEP_SUMMARY"
