name: Pin original temporal evidence
on:
  push:
    branches: [codex/mutation-temporal-relations]
    paths: [.github/workflows/pin-temporal-fixture.yml]
permissions:
  contents: write
  actions: read
jobs:
  pin:
    if: github.repository == 'pengjiu/Auto-Prediction' && github.ref == 'refs/heads/codex/mutation-temporal-relations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original artifact and preserve only its capture subtree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, urllib.request, urllib.error, urllib.parse, zipfile
          changes=subprocess.check_output(['git','diff','--name-only','49e71917a89df323967e7b485b859a45c9273a19','HEAD'],text=True).splitlines()
          assert changes==['.github/workflows/pin-temporal-fixture.yml'],changes
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          req=urllib.request.Request('https://api.github.com/repos/pengjiu/Auto-Prediction/actions/artifacts/11762581792/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=30) as response: data=response.read(10_000_001)
          except urllib.error.HTTPError as exc:
              if exc.code not in (301,302,303,307,308): raise
              location=exc.headers['Location'];url=urllib.parse.urlparse(location)
              assert url.scheme=='https' and not url.username and not url.password and url.hostname.endswith(('.blob.core.windows.net','.githubusercontent.com','.actions.githubusercontent.com'))
              # The storage request carries no GitHub authorization header.
              with urllib.request.urlopen(location,timeout=30) as response: data=response.read(10_000_001)
          assert hashlib.sha256(data).hexdigest()=='2c43f339e01feb64fedf66769f38d58dd16aff31229925b37bd466b821647c5c'
          root=pathlib.Path('research/payoff-economics/s5/fixtures');root.mkdir(exist_ok=False)
          archive=root/'temporal-capture-2026-10-12.zip';files={}
          with zipfile.ZipFile(io.BytesIO(data)) as original, zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_STORED) as target:
              assert len(original.namelist())==len(set(original.namelist()))
              members=sorted(n for n in original.namelist() if n.startswith('temporal/capture/') and not n.endswith('/'))
              assert len(members)==41
              for source in members:
                  name=source.removeprefix('temporal/');assert '..' not in pathlib.PurePosixPath(name).parts
                  raw=original.read(source)
                  info=zipfile.ZipInfo(name,(2026,10,12,17,23,16));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644<<16
                  target.writestr(info,raw);files[name]={'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              result=json.loads(original.read('temporal/result.json'))
          index={'schema':'s5.raw-fixture-index.v1','provenance':'DERIVED_CONTAINER_WITH_UNCHANGED_ORIGINAL_CAPTURE_BYTES','original_github_run':38283606507,'original_artifact':11762581792,'original_artifact_sha256':'2c43f339e01feb64fedf66769f38d58dd16aff31229925b37bd466b821647c5c','capture_source_commit':'49e71917a89df323967e7b485b859a45c9273a19','archive_name':archive.name,'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':files,'expected_summary':result['summary'],'expected_protocol_completed':True,'new_network_capture':False,'note':'The original full artifact also contains source and logs; this smaller ZIP preserves every capture byte, not that original archive layout.'}
          (root/'index.json').write_text(json.dumps(index,indent=2)+'\n')
          for path,want in [(root/'index.json','39836e47480fe660aae4e0ba4b8e3f1ffd5f9ef9'),(archive,'64ce36d8cc6e3145dd7dc3bebc7ed0f85625e5d1')]:
              actual=subprocess.check_output(['git','hash-object',str(path)],text=True).strip();assert actual==want,(path,actual)
          assert index['archive_sha256']=='209fc4062c4ecc94e763399aedc836c4a24b5822d26638418cf173c8019dcf36'
          PY
      - name: Publish verified fixture only, without workflow or main changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/mutation-temporal-relations | cut -f1)" = "$GITHUB_SHA"
          git add -- research/payoff-economics/s5/fixtures/index.json research/payoff-economics/s5/fixtures/temporal-capture-2026-10-12.zip
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'Auto Prediction research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: retain original temporal capture bytes and exact provenance for offline replay'
          git push origin HEAD:refs/heads/codex/mutation-temporal-relations
